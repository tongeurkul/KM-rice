        async function loadDataFromFirestore() {
            try {
                const collections = ['orders', 'inventory', 'customers', 'production', 'silos', 'yields', 'logs'];
                for (const collName of collections) {
                    const snapshot = await db.collection(collName).get();
                    if (!snapshot.empty) {
                        mockData[collName] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                }
                console.log('✅ Loaded data from Firestore');
                render();
            } catch (error) {
                console.error('❌ Error loading from Firestore:', error);
            }
        }

        async function saveToFirestore(collection, data) {
            try {
                if (data.id && !data.id.startsWith('temp_')) {
                    await db.collection(collection).doc(data.id).set(data);
                } else {
                    const docRef = await db.collection(collection).add(data);
                    data.id = docRef.id;
                }
                console.log(`✅ Saved to ${collection}:`, data.id);
                return data.id;
            } catch (error) {
                console.error(`❌ Error saving to ${collection}:`, error);
                throw error;
            }
        }

        async function deleteFromFirestore(collection, id) {
            try {
                await db.collection(collection).doc(id).delete();
                console.log(`✅ Deleted from ${collection}:`, id);
            } catch (error) {
                console.error(`❌ Error deleting from ${collection}:`, error);
                throw error;

        // ===================== HELPER FUNCTIONS =====================
        function parseNum(val) {
            return parseFloat(String(val || 0).replace(/,/g, '')) || 0;
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('th-TH').format(num);
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }).format(num);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric' });
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded-xl shadow-2xl text-white z-[100] flex items-center gap-3 fade-in ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.innerHTML = `
                <span class="text-xl">${type === 'success' ? icons.check : icons.alert}</span>
                <span class="font-medium">${message}</span>
                <button onclick="this.parentElement.remove()" class="ml-2 hover:bg-white/20 p-1 rounded">${icons.close}</button>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showModal(title, content) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden fade-in" onclick="event.stopPropagation()">
                    <div class="px-6 py-4 border-b dark:border-gray-700 flex justify-between items-center bg-gradient-to-r from-green-50 to-emerald-50 dark:from-gray-900 dark:to-gray-800">
                        <h3 class="font-bold text-xl text-gray-800 dark:text-white">${title}</h3>

                    </div>
                    <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">${content}</div>

        window.handleOrderSave = async function (form, editId = '') {
            const orderData = {
                date: form.date.value,
                customer: form.customer.value,
                product: form.product.value,
                quantity: parseNum(form.quantity.value),
                amount: parseNum(form.amount.value),
                status: form.status.value
            };

            // Close modal immediately for better UX
            document.querySelector('.fixed')?.remove();

            try {
                if (editId) {
                    // Edit existing order
                    const index = mockData.orders.findIndex(o => o.id === editId);
                    if (index !== -1) {
                        mockData.orders[index] = {
                            ...mockData.orders[index],
                            ...orderData
                        };
                        await saveToFirestore('orders', mockData.orders[index]);
                    }
                } else {
                    // Add new order
                    const newOrder = {
                        ...orderData,
                        id: 'temp_' + Date.now().toString(),
                        displayId: `#ORD-${Math.floor(Math.random() * 9000) + 1000}`
                    };
                    const newId = await saveToFirestore('orders', newOrder);
                    newOrder.id = newId;
                    mockData.orders.unshift(newOrder);
                }

                showToast('บันทึกสำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการบันทึก!', 'error');
            }
        };

        window.handleInventorySave = async function (form, editId = '') {
            const itemData = {
                code: form.code.value,
                item: form.item.value,
                category: form.category.value,
                stock: parseNum(form.stock.value),
                location: form.location.value
            };

            // Close modal immediately for better UX
            document.querySelector('.fixed')?.remove();

            try {
                if (editId) {
                    // Edit existing item
                    const index = mockData.inventory.findIndex(i => i.id === editId);
                    if (index !== -1) {
                        mockData.inventory[index] = {
                            ...mockData.inventory[index],
                            ...itemData
                        };
                        await saveToFirestore('inventory', mockData.inventory[index]);
                    }
                } else {
                    // Add new item
                    const newItem = {
                        ...itemData,
                        id: 'temp_' + Date.now().toString()
                    };
                    const newId = await saveToFirestore('inventory', newItem);
                    newItem.id = newId;
                    mockData.inventory.push(newItem);
                }

                showToast('บันทึกสำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการบันทึก!', 'error');
            }
        };

        window.handleSiloSave = async function (form, editId = '') {
            const siloData = {
                rice: form.rice.value.trim(),
                amount: parseNum(form.amount.value),
                capacity: parseNum(form.capacity.value)
            };

            // Validate amount doesn't exceed capacity
            if (siloData.amount > siloData.capacity) {
                showToast('ปริมาณเกินความจุ!', 'error');
                return;
            }

            // Close modal immediately for better UX
            document.querySelector('.fixed')?.remove();

            try {
                if (editId) {
                    // Edit existing silo
                    const index = mockData.silos.findIndex(s => s.id === editId);
                    if (index !== -1) {
                        mockData.silos[index] = {
                            ...mockData.silos[index],
                            ...siloData
                        };
                        await saveToFirestore('silos', mockData.silos[index]);
                    }
                }

                showToast('บันทึกสำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการบันทึก!', 'error');
            }
        };

                    mockData.orders = mockData.orders.filter(o => o.id !== id);
                    showToast('ลบสำเร็จ!');
                    render();

                        </div>
                    </div>

                    <!-- Production Table -->
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 border-b-2 border-gray-200 dark:border-gray-700">
                                    <tr>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">เลขที่</th>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">เริ่มผลิต</th>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">วัตถุดิบ</th>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ผลผลิต</th>
                                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">สถานะ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                                    ${mockData.production.map(p => `
                                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-all">
                                            <td class="px-6 py-4 font-bold text-green-600 dark:text-green-400">${p.displayId}</td>
                                            <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${formatDateTime(p.startDateTime)}</td>
                                            <td class="px-6 py-4">
                                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300">${p.source}</div>
                                                <div class="text-xs text-red-600 dark:text-red-400">-${formatNumber(parseNum(p.inputAmount))} กก.</div>
                                            </td>
                                            <td class="px-6 py-4">
                                                <div class="text-sm font-medium text-blue-700 dark:text-blue-400">${p.rice}</div>
                                                <div class="text-xs text-green-600 dark:text-green-400">+${formatNumber(parseNum(p.amount))} กก.</div>
                                            </td>
                                            <td class="px-6 py-4">
                                                <span class="px-3 py-1.5 rounded-full text-xs font-semibold ${p.status === 'สำเร็จ' ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' :
                    p.status === 'กำลังผลิต' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' :
                        'bg-gray-100 text-gray-700 dark:bg-gray-900/30 dark:text-gray-400'
                }">
                                                    ${p.status}

                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInventory() {
            // Warehouse Map View (Default)
            const zoneA = mockData.inventory.filter(i => i.location.includes('Zone A'));
            const zoneB = mockData.inventory.filter(i => i.location.includes('Zone B'));
            const zoneC = mockData.inventory.filter(i => i.location.includes('Zone C'));
            const zoneD = mockData.inventory.filter(i => i.location.includes('Zone D'));
            const warehouseA = mockData.inventory.filter(i => i.location.includes('โกดัง A'));
            const warehouseB = mockData.inventory.filter(i => i.location.includes('โกดัง B'));
            const warehouseC = mockData.inventory.filter(i => i.location.includes('โกดัง C'));
            const others = mockData.inventory.filter(i => !i.location.includes('Zone') && !i.location.includes('โกดัง'));

            const renderZone = (title, items, color, icon, zoneName) => {
                return `
                    <div class="p-5 rounded-2xl border-2 border-${color}-200 dark:border-${color}-800 bg-gradient-to-br from-${color}-50 to-white dark:from-${color}-900/20 dark:to-gray-800 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg text-gray-800 dark:text-white flex items-center gap-2">
                                <span class="text-xl">${icon}</span>
                                ${title}
                                <span class="text-sm font-normal text-gray-500 dark:text-gray-400">(${items.length} รายการ)</span>
                            </h3>
                            <button onclick="event.stopPropagation(); openInventoryFormWithZone('${zoneName}')" 
                                class="p-2 bg-${color}-600 hover:bg-${color}-700 text-white rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-1" title="เพิ่มสินค้าใน ${zoneName}">
                                <span class="text-lg font-bold">+</span>
                                <span class="text-xs hidden sm:inline">เพิ่ม</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            ${items.length === 0 ? `
                                <div class="col-span-full text-center py-8 text-gray-400 dark:text-gray-600">
                                    <span class="text-3xl">📦</span>
                                    <p class="mt-2">ยังไม่มีสินค้าใน ${zoneName}</p>
                                </div>
                            ` : items.map(item => {
                    const isLow = parseNum(item.stock) < 1000;
                    return `
                                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border-2 ${isLow ? 'border-red-300 dark:border-red-700' : 'border-gray-200 dark:border-gray-700'} hover:shadow-xl transition-all card-hover relative group">
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="px-2 py-1 bg-${color}-600 text-white text-xs font-bold rounded-md">${item.code}</span>
                                            <div class="flex items-center gap-1">
                                                ${isLow ? `<span class="text-red-500 text-lg animate-pulse">${icons.alert}</span>` : ''}
                                                <button onclick="event.stopPropagation(); deleteInventory('${item.id}')" 
                                                    class="opacity-0 group-hover:opacity-100 p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-all" title="ลบ">
                                                    ${icons.delete}
                                                </button>
                                            </div>
                                        </div>
                                        <div onclick="editInventory('${item.id}')" class="cursor-pointer">
                                            <h4 class="font-semibold text-sm text-gray-800 dark:text-white mb-2 line-clamp-2 min-h-[40px]">${item.item}</h4>
                                            <div class="text-center py-2 bg-gray-50 dark:bg-gray-900 rounded-lg">
                                                <div class="text-2xl font-bold ${isLow ? 'text-red-600' : 'text-gray-800 dark:text-white'}">
                                                    ${formatNumber(parseNum(item.stock))}
                                                </div>
                                                <div class="text-xs text-gray-500 dark:text-gray-400">${item.category === 'วัสดุบรรจุภัณฑ์' ? 'ชิ้น' : 'กก.'}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                }).join('')}
                        </div>
                    </div>
                `;
            };

            return `
                <div class="space-y-6 fade-in">
                    <!-- Warehouse Map Header -->
                    <div class="bg-gradient-to-r from-blue-50 to-cyan-50 dark:from-blue-900/20 dark:to-cyan-900/20 p-6 rounded-2xl border-2 border-blue-200 dark:border-blue-800 shadow-lg">
                        <div class="flex items-center gap-3">
                            <div class="p-3 bg-white dark:bg-gray-800 rounded-xl shadow-md">
                                <span class="text-3xl">🗺️</span>
                            </div>
                            <div>
                                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">แผนผังคลังสินค้า (Warehouse Map)</h2>
                                <p class="text-sm text-gray-600 dark:text-gray-400">มุมมองตามโซนการจัดเก็บ</p>
                            </div>
                        </div>
                    </div>

                    <!-- Warehouse Zones -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        ${renderZone('โกดัง A (Warehouse A)', warehouseA, 'amber', '🏢', 'โกดัง A')}
                        ${renderZone('โกดัง B (Warehouse B)', warehouseB, 'amber', '🏢', 'โกดัง B')}
                        ${renderZone('โกดัง C (Warehouse C)', warehouseC, 'amber', '🏢', 'โกดัง C')}
                    </div>

                    <!-- Production Zones -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderZone('Zone A (ข้าวต้น)', zoneA, 'green', '📦', 'Zone A')}
                        ${renderZone('Zone B (Reject)', zoneB, 'orange', '📦', 'Zone B')}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderZone('Zone C (ข้าวหัก/ปลาย)', zoneC, 'blue', '📦', 'Zone C')}
                        ${renderZone('Zone D (Reject)', zoneD, 'red', '📦', 'Zone D')}
                    </div>

                    <!-- Other Storage -->
                    <div class="p-5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-gradient-to-br from-gray-50 to-white dark:from-gray-800 dark:to-gray-900 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg text-gray-800 dark:text-white flex items-center gap-2">
                                <span class="text-xl">📁</span>
                                พื้นที่อื่นๆ (Other Storage)
                                <span class="text-sm font-normal text-gray-500 dark:text-gray-400">(${others.length} รายการ)</span>
                            </h3>
                            <button onclick="event.stopPropagation(); openInventoryForm()" 
                                class="p-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-1" title="เพิ่มสินค้าใหม่">
                                <span class="text-lg font-bold">+</span>
                                <span class="text-xs hidden sm:inline">เพิ่ม</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            ${others.length === 0 ? `
                                <div class="col-span-full text-center py-8 text-gray-400 dark:text-gray-600">
                                    <span class="text-3xl">📦</span>
                                    <p class="mt-2">ยังไม่มีสินค้าในพื้นที่อื่นๆ</p>
                                </div>
                            ` : others.map(item => {
                const isLow = parseNum(item.stock) < 1000;
                return `
                                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border-2 ${isLow ? 'border-red-300 dark:border-red-700' : 'border-gray-200 dark:border-gray-700'} hover:shadow-xl transition-all card-hover relative group">
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="px-2 py-1 bg-purple-600 text-white text-xs font-bold rounded-md">${item.code}</span>
                                            <div class="flex items-center gap-1">
                                                ${isLow ? `<span class="text-red-500 text-lg animate-pulse">${icons.alert}</span>` : ''}
                                                <button onclick="event.stopPropagation(); deleteInventory('${item.id}')" 
                                                    class="opacity-0 group-hover:opacity-100 p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-all" title="ลบ">
                                                    ${icons.delete}
                                                </button>
                                            </div>
                                        </div>
                                        <div onclick="editInventory('${item.id}')" class="cursor-pointer">
                                            <h4 class="font-semibold text-sm text-gray-800 dark:text-white mb-2 line-clamp-2 min-h-[40px]">${item.item}</h4>
                                            <div class="text-center py-2 bg-gray-50 dark:bg-gray-900 rounded-lg">
                                                <div class="text-2xl font-bold ${isLow ? 'text-red-600' : 'text-gray-800 dark:text-white'}">
                                                    ${formatNumber(parseNum(item.stock))}
                                                </div>
                                                <div class="text-xs text-gray-500 dark:text-gray-400">${item.category === 'วัสดุบรรจุภัณฑ์' ? 'ชิ้น' : 'กก.'}</div>
                                            </div>
                                            <div class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1 mt-2">
                                                <span>📍</span>
                                                ${item.location}
                                            </div>
                                        </div>
                                    </div>
                                `;
            }).join('')}
                        </div>
                    </div>

                    <!-- Summary Stats -->
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700">
                        <h3 class="font-bold text-lg mb-4 dark:text-white flex items-center gap-2">
                            <span class="text-xl">📊</span>
                            สรุปสต็อกแยกตามหมวดหมู่
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                            ${['ข้าวสาร', 'ข้าวเปลือก', 'ข้าวหัก/ปลาย', 'Reject', 'วัสดุบรรจุภัณฑ์'].map(cat => {
                const items = mockData.inventory.filter(i => i.category === cat);
                const total = items.reduce((s, i) => s + parseNum(i.stock), 0);
                const colorMap = {
                    'ข้าวสาร': 'green',
                    'ข้าวเปลือก': 'yellow',
                    'ข้าวหัก/ปลาย': 'blue',
                    'Reject': 'red',
                    'วัสดุบรรจุภัณฑ์': 'purple'
                };
                const color = colorMap[cat];
                return `
                                    <div class="p-4 bg-${color}-50 dark:bg-${color}-900/20 rounded-xl border border-${color}-200 dark:border-${color}-800 text-center">
                                        <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${cat}</div>
                                        <div class="text-2xl font-bold text-${color}-600 dark:text-${color}-400">${formatNumber(total)}</div>
                                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${items.length} รายการ</div>
                                    </div>
                                `;
            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCustomers() {
            return `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden fade-in">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 border-b-2 border-gray-200 dark:border-gray-700">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ชื่อ</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ประเภท</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">โทร</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ภูมิภาค</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ที่อยู่</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                                ${mockData.customers.map(c => `
                                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-all">
                                        <td class="px-6 py-4 font-semibold text-gray-800 dark:text-white">${c.name}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400">
                                                ${c.type}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${c.phone}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                ${c.region}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${c.location}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ===================== MAIN RENDER =====================
        function render() {
            const menuList = [
                { id: 'dashboard', icon: icons.dashboard, label: 'ภาพรวม' },
                { id: 'orders', icon: icons.orders, label: 'คำสั่งซื้อ' },
                { id: 'production', icon: icons.production, label: 'การผลิต' },
                { id: 'inventory', icon: icons.inventory, label: 'คลังสินค้า' },
                { id: 'customers', icon: icons.customers, label: 'ลูกค้า' },
                { id: 'logs', icon: icons.logs, label: 'ประวัติ' }
            ];

            let content = '';
            switch (currentMenu) {
                case 'dashboard': content = renderDashboard(); break;
                case 'orders': content = renderOrders(); break;
                case 'production': content = renderProduction(); break;
                case 'inventory': content = renderInventory(); break;
                case 'customers': content = renderCustomers(); break;
                default: content = '<div class="text-center py-20 text-gray-500 dark:text-gray-400">กำลังพัฒนา...</div>';
            }

            document.getElementById('app').innerHTML = `
                <div class="flex h-screen">
                    <!-- Mobile Menu Overlay -->
                    ${mobileMenuOpen ? `<div class="fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="mobileMenuOpen = false; render();"></div>` : ''}

                    <!-- Sidebar -->
                    <div class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-transform duration-300 ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none">
                        <div class="h-20 flex items-center justify-center border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-green-50 to-emerald-50 dark:from-gray-900 dark:to-gray-800">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-gradient-to-br from-green-600 to-emerald-600 text-white rounded-2xl flex items-center justify-center font-bold text-2xl shadow-lg">K</div>
                                <div>
                                    <h1 class="font-bold text-gray-800 dark:text-white text-xl">กมลค้าข้าว</h1>
                                    <p class="text-xs text-gray-500 dark:text-gray-400">Rice Mill ERP</p>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 space-y-2 flex-1 overflow-y-auto">
                            ${menuList.map(m => `
                                <button onclick="currentMenu='${m.id}'; mobileMenuOpen=false; render();" 
                                    class="w-full flex items-center gap-3 p-3.5 rounded-xl transition-all duration-200 ${currentMenu === m.id
                    ? 'bg-gradient-to-r from-green-600 to-emerald-600 text-white font-semibold shadow-lg scale-105'
                    : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white'
                }">
                                    <span class="text-xl">${m.icon}</span>
                                    <span class="flex-1 text-left">${m.label}</span>
                                    ${currentMenu === m.id ? '<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>' : ''}
                                </button>
                            `).join('')}
                        </div>
                        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                            <div class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-700 dark:to-gray-600 p-4 rounded-xl flex items-center gap-3 shadow-sm">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-600 to-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-md">A</div>
                                <div class="flex-1">
                                    <p class="text-sm font-semibold text-gray-800 dark:text-white">ผู้ดูแลระบบ</p>
                                    <p class="text-xs text-green-600 dark:text-green-400 flex items-center gap-1">
                                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                        ออนไลน์
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Content -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <!-- Header -->
                        <header class="h-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center px-6 shadow-sm">
                            <div class="flex items-center gap-4">
                                <button onclick="mobileMenuOpen = true; render();" class="lg:hidden p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span class="text-2xl">${icons.menu}</span>
                                </button>
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">${menuList.find(m => m.id === currentMenu)?.label}</h2>
                                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${new Date().toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode); render();" 
                                    class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span class="text-2xl">${darkMode ? icons.sun : icons.moon}</span>
                                </button>
                                ${currentMenu === 'orders' ? `
                                    <button onclick="openOrderForm()" 
                                        class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all flex items-center gap-2">
                                        <span class="text-lg">${icons.plus}</span>
                                        <span class="hidden sm:inline">เพิ่มรายการ</span>
                                    </button>
                                ` : ''}
                            </div>
                        </header>

                        <!-- Content -->
                        <main class="flex-1 p-4 lg:p-8 overflow-y-auto bg-gray-50 dark:bg-gray-900">
                            <div class="max-w-7xl mx-auto">
                                ${content}
                            </div>
                        </main>
                    </div>
                </div>
            `;

            if (darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // ===================== INIT =====================
        render();
        // Load data from Firestore after initial render
        loadDataFromFirestore();
    </script>
</body>

</html>
