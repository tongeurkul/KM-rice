                    isLoading = false;
                    render();
                    return true;
                }
            } catch (e) {
                console.error('Cache load error:', e);
            }
            return false;
        }

        async function loadDataFromFirestore() {
            try {
                const collections = ['orders', 'salesOrders', 'inventory', 'customers', 'production', 'silos', 'yields', 'logs'];
                for (const collName of collections) {
                    const snapshot = await db.collection(collName).get();
                    if (!snapshot.empty) {
                        const firestoreData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        // For silos: replace entirely with Firestore data
                        if (collName === 'silos') {
                            mockData.silos = firestoreData;
                            // Sort silos by number
                            mockData.silos.sort((a, b) => (a.number || 0) - (b.number || 0));
                        } else {
                            // For other collections: merge
                            firestoreData.forEach(fsItem => {
                                const existingIndex = mockData[collName].findIndex(m => m.id === fsItem.id);
                                if (existingIndex !== -1) {
                                    mockData[collName][existingIndex] = fsItem;
                                } else {
                                    mockData[collName].push(fsItem);
                                }
                            });
                        }
                    }
                }
                console.log('✅ Loaded data from Firestore');
                isLoading = false;
                saveToCache(); // Save to cache for next visit
                render();
            } catch (error) {
                console.error('❌ Error loading from Firestore:', error);
                isLoading = false;
                render();
            }
        }

            try {
                const snapshot = await db.collection('silos').get();

                    console.log('🌱 Seeding silos to Firestore...');
                    for (const silo of mockData.silos) {
                        await db.collection('silos').doc(silo.id).set(silo);
                    }
                    console.log('✅ Silos seeded successfully');
                } else {
                    console.log('ℹ️ Silos already exist in Firestore, skipping seed');
                }
            } catch (error) {
                console.error('❌ Error seeding silos:', error);
            }
        }

        async function saveToFirestore(collection, data) {
            try {
                if (data.id && !data.id.startsWith('temp_')) {
                    await db.collection(collection).doc(data.id).set(data);
                } else {
                    const docRef = await db.collection(collection).add(data);
                    data.id = docRef.id;
                }
                console.log(`✅ Saved to ${collection}:`, data.id);
                return data.id;
            } catch (error) {
                console.error(`❌ Error saving to ${collection}:`, error);
                throw error;
            }
        }

        async function deleteFromFirestore(collection, id) {
            try {
                await db.collection(collection).doc(id).delete();
                console.log(`✅ Deleted from ${collection}:`, id);
            } catch (error) {
                console.error(`❌ Error deleting from ${collection}:`, error);

        // ===================== HELPER FUNCTIONS =====================
        function parseNum(val) {
            return parseFloat(String(val || 0).replace(/,/g, '')) || 0;
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('th-TH').format(num);
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }).format(num);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric' });
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

            setTimeout(() => toast.remove(), 3000);

        // ===================== SO NUMBER GENERATION =====================
        function generateSONumber() {
            const now = new Date();
            const yy = (now.getFullYear() + 543).toString().slice(-2); // Buddhist era
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            soCounter++;
            localStorage.setItem('soCounter', soCounter.toString());
            return `SO${yy}${mm}-${String(soCounter).padStart(4, '0')}`;
        }

        // ===================== SO LINE ITEMS STATE =====================
        let soLineItems = [{ product: '', packSize: '', qty: '', unit: 'กระสอบ', unitPrice: '', amount: 0, totalWeight: 0 }];

        function addSOLineItem() {
            soLineItems.push({ product: '', packSize: '', qty: '', unit: 'กระสอบ', unitPrice: '', amount: 0, totalWeight: 0 });
            rerenderSOItems();
        }

        function removeSOLineItem(idx) {
            if (soLineItems.length <= 1) return;
            soLineItems.splice(idx, 1);
            rerenderSOItems();
            recalcSOTotals();
        }

        function onSOItemChange(idx, field, value) {
            soLineItems[idx][field] = value;
            if (field === 'product') {
                // reset pack size when product changes
                soLineItems[idx].packSize = '';
            }
            // Recalc this row
            const item = soLineItems[idx];
            const qty = parseNum(item.qty);
            const price = parseNum(item.unitPrice);
            const pack = parseNum(item.packSize);
            item.amount = qty * price;
            item.totalWeight = qty * pack;

            if (field === 'product') {
                rerenderSOItems();
            } else {
                // Update just the computed fields for this row
                const amtEl = document.getElementById(`so-item-amount-${idx}`);
                const wgtEl = document.getElementById(`so-item-weight-${idx}`);
                if (amtEl) amtEl.textContent = formatNumber(item.amount);
                if (wgtEl) wgtEl.textContent = pack > 0 && qty > 0 ? `${formatNumber(item.totalWeight)} กก.` : '-';
            }
            recalcSOTotals();
        }

        function recalcSOTotals() {
            const subtotal = soLineItems.reduce((s, i) => s + (parseNum(i.qty) * parseNum(i.unitPrice)), 0);
            const discountEl = document.getElementById('so-discount');
            const discount = discountEl ? parseNum(discountEl.value) : 0;
            const grand = subtotal - discount;

            const subEl = document.getElementById('so-subtotal');
            const grandEl = document.getElementById('so-grandtotal');
            const totalWeightEl = document.getElementById('so-total-weight');
            if (subEl) subEl.textContent = formatCurrency(subtotal);
            if (grandEl) grandEl.textContent = formatCurrency(grand);

            const totalWeight = soLineItems.reduce((s, i) => s + (parseNum(i.qty) * parseNum(i.packSize)), 0);
            if (totalWeightEl) totalWeightEl.textContent = totalWeight > 0 ? `${formatNumber(totalWeight)} กก. (${(totalWeight / 1000).toFixed(2)} ตัน)` : '-';
        }

            const p = PRODUCT_CATALOG.find(c => c.name === productName);
            return p ? p.sizes : [];
        }

                return `

        // ===================== SO SAVE HANDLER =====================
        window.handleSOSave = async function (editId, soNumber) {
            const form = document.getElementById('so-form');
            if (!form) return;

            // Validate at least one line item has product
            const validItems = soLineItems.filter(i => i.product);
            if (validItems.length === 0) {
                showToast('กรุณาเลือกสินค้าอย่างน้อย 1 รายการ', 'error');
                return;
            }

            const subtotal = validItems.reduce((s, i) => s + (parseNum(i.qty) * parseNum(i.unitPrice)), 0);
            const discount = parseNum(form.discount.value);

            const soData = {
                soNumber: soNumber,
                orderDate: form.orderDate.value,
                customerName: form.customerName.value,
                customerRef: form.customerRef.value,
                items: validItems.map(i => ({
                    product: i.product,
                    packSize: parseNum(i.packSize),
                    qty: parseNum(i.qty),
                    unit: i.unit,
                    unitPrice: parseNum(i.unitPrice),
                    amount: parseNum(i.qty) * parseNum(i.unitPrice),
                    totalWeight: parseNum(i.qty) * parseNum(i.packSize)
                })),
                deliveryDate: form.deliveryDate.value,
                shippingAddress: form.shippingAddress.value,
                deliveryMethod: form.deliveryMethod.value,
                truckNo: form.truckNo.value,
                driverName: form.driverName.value,
                freightTerms: form.freightTerms.value,
                paymentTerms: form.paymentTerms.value,
                subtotal: subtotal,
                discount: discount,
                grandTotal: subtotal - discount,
                internalRemarks: form.internalRemarks.value,
                customerRemarks: form.customerRemarks.value,
                status: form.status.value
            };

            // Close modal
            document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());

            try {
                if (editId) {
                    const index = mockData.salesOrders.findIndex(o => o.id === editId);
                    if (index !== -1) {
                        mockData.salesOrders[index] = { ...mockData.salesOrders[index], ...soData };
                        await saveToFirestore('salesOrders', mockData.salesOrders[index]);
                    }
                } else {
                    const newSO = {
                        ...soData,
                        id: 'temp_' + Date.now().toString(),
                        createdAt: new Date().toISOString()
                    };
                    const newId = await saveToFirestore('salesOrders', newSO);
                    newSO.id = newId;
                    mockData.salesOrders.unshift(newSO);
                }

                saveToCache();
                showToast('บันทึกใบสั่งซื้อสำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการบันทึก!', 'error');
            }
        };

        window.editSO = function (id) {
            const so = mockData.salesOrders.find(o => o.id === id);
            if (so) openSOForm(so);
        };

        window.deleteSO = async function (id) {
            if (confirm('ยืนยันการลบใบสั่งซื้อนี้?')) {
                try {
                    await deleteFromFirestore('salesOrders', id);
                    mockData.salesOrders = mockData.salesOrders.filter(o => o.id !== id);
                    saveToCache();
                    showToast('ลบใบสั่งซื้อสำเร็จ!');
                    render();
                } catch (error) {
                    showToast('เกิดข้อผิดพลาดในการลบ!', 'error');
                }
            }
        };

        window.printSO = function (id) {
            const so = mockData.salesOrders.find(o => o.id === id);
            if (!so) return;

            const totalWeight = (so.items || []).reduce((s, i) => s + (parseNum(i.totalWeight) || (parseNum(i.qty) * parseNum(i.packSize))), 0);

            const printWindow = window.open('', '_blank', 'width=800,height=900');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="th">
                <head>
                    <meta charset="UTF-8">
                    <title>ใบสั่งซื้อ ${so.soNumber}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body { font-family: 'Sarabun', sans-serif; padding: 30px; color: #333; font-size: 14px; }
                        .header { text-align: center; border-bottom: 3px solid #16a34a; padding-bottom: 15px; margin-bottom: 20px; }
                        .header h1 { font-size: 22px; color: #16a34a; margin-bottom: 4px; }
                        .header .company { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
                        .header .subtitle { font-size: 12px; color: #888; }
                        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; }
                        .info-item { font-size: 13px; }
                        .info-item .label { font-weight: 600; color: #666; font-size: 11px; }
                        .info-item .value { font-weight: 600; color: #111; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                        th { background: #16a34a; color: white; padding: 10px 8px; font-size: 12px; text-align: left; }
                        td { padding: 8px; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
                        tr:nth-child(even) { background: #f9fafb; }
                        .summary { display: flex; justify-content: flex-end; margin-bottom: 20px; }
                        .summary-box { width: 280px; border: 2px solid #16a34a; border-radius: 8px; overflow: hidden; }
                        .summary-row { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 13px; }
                        .summary-row.total { background: #16a34a; color: white; font-size: 16px; font-weight: 700; }
                        .section-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; padding: 4px 0; border-bottom: 1px solid #ddd; color: #333; }
                        .shipping-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
                        .remarks { margin-bottom: 15px; padding: 10px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px; font-size: 13px; }
                        .footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid #e5e7eb; font-size: 11px; color: #aaa; }
                        .signature-area { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 50px; }
                        .signature-box { text-align: center; }
                        .signature-line { border-bottom: 1px solid #333; margin-bottom: 5px; height: 40px; }
                        .signature-label { font-size: 12px; color: #666; }
                        @media print { body { padding: 15px; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="company">กมลค้าข้าว</div>
                        <h1>ใบสั่งซื้อ (Sales Order)</h1>
                        <div class="subtitle">Kamol Rice ERP</div>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="label">เลขที่ SO</div>
                            <div class="value" style="color: #16a34a; font-size: 16px;">${so.soNumber}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">วันที่สั่งซื้อ</div>
                            <div class="value">${formatDate(so.orderDate)}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">ลูกค้า</div>
                            <div class="value">${so.customerName || '-'}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">เลขที่อ้างอิง (PO)</div>
                            <div class="value">${so.customerRef || '-'}</div>
                        </div>
                    </div>

                    <div class="section-title">📦 รายการสินค้า</div>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>สินค้า</th>
                                <th style="text-align:center">ขนาดบรรจุ</th>
                                <th style="text-align:center">จำนวน</th>
                                <th style="text-align:right">ราคา/หน่วย</th>
                                <th style="text-align:right">น้ำหนัก</th>
                                <th style="text-align:right">จำนวนเงิน</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(so.items || []).map((item, idx) => `
                                <tr>
                                    <td>${idx + 1}</td>
                                    <td>${item.product}</td>
                                    <td style="text-align:center">${item.packSize} กก.</td>
                                    <td style="text-align:center">${formatNumber(item.qty)} ${item.unit || 'กระสอบ'}</td>
                                    <td style="text-align:right">${formatCurrency(item.unitPrice)}</td>
                                    <td style="text-align:right">${formatNumber(item.totalWeight || (item.qty * item.packSize))} กก.</td>
                                    <td style="text-align:right; font-weight:600">${formatCurrency(item.amount)}</td>
                                </tr>
                            `).join('')}
                            <tr style="background:#f0fdf4">
                                <td colspan="3" style="font-weight:600">รวมทั้งหมด</td>
                                <td style="text-align:center; font-weight:600">${formatNumber((so.items || []).reduce((s, i) => s + parseNum(i.qty), 0))} กระสอบ</td>
                                <td></td>
                                <td style="text-align:right; font-weight:600">${formatNumber(totalWeight)} กก.</td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="summary">
                        <div class="summary-box">
                            <div class="summary-row" style="border-bottom:1px solid #e5e7eb">
                                <span>ยอดรวม (Subtotal)</span>
                                <span>${formatCurrency(so.subtotal || 0)}</span>
                            </div>
                            ${parseNum(so.discount) > 0 ? `
                                <div class="summary-row" style="border-bottom:1px solid #e5e7eb">
                                    <span>ส่วนลด</span>
                                    <span style="color:red">-${formatCurrency(so.discount)}</span>
                                </div>
                            ` : ''}
                            <div class="summary-row total">
                                <span>ยอดสุทธิ (Grand Total)</span>
                                <span>${formatCurrency(so.grandTotal || 0)}</span>
                            </div>
                        </div>
                    </div>

                    ${so.deliveryDate || so.deliveryMethod || so.shippingAddress || so.truckNo ? `
                        <div class="section-title">🚚 ข้อมูลการจัดส่ง</div>
                        <div class="shipping-grid">
                            <div class="info-item"><div class="label">วันที่นัดส่ง</div><div class="value">${so.deliveryDate ? formatDate(so.deliveryDate) : '-'}</div></div>
                            <div class="info-item"><div class="label">วิธีจัดส่ง</div><div class="value">${so.deliveryMethod || '-'}</div></div>
                            <div class="info-item"><div class="label">เงื่อนไขค่าขนส่ง</div><div class="value">${so.freightTerms || '-'}</div></div>
                            <div class="info-item"><div class="label">ทะเบียนรถ</div><div class="value">${so.truckNo || '-'}</div></div>
                            <div class="info-item"><div class="label">ชื่อคนขับ</div><div class="value">${so.driverName || '-'}</div></div>
                            <div class="info-item"><div class="label">สถานที่จัดส่ง</div><div class="value">${so.shippingAddress || '-'}</div></div>
                        </div>
                    ` : ''}

                    <div class="info-item" style="margin-bottom:10px">
                        <div class="label">เงื่อนไขชำระเงิน</div>
                        <div class="value">${so.paymentTerms || '-'}</div>
                    </div>

                    ${so.customerRemarks ? `
                        <div class="remarks">
                            <strong>หมายเหตุ:</strong> ${so.customerRemarks}
                        </div>
                    ` : ''}

                    <div class="signature-area">
                        <div class="signature-box">
                            <div class="signature-line"></div>
                            <div class="signature-label">ผู้สั่งซื้อ / ลูกค้า</div>
                            <div class="signature-label">วันที่ ........./........./.........</div>
                        </div>
                        <div class="signature-box">
                            <div class="signature-line"></div>
                            <div class="signature-label">ผู้อนุมัติ / โรงสี</div>
                            <div class="signature-label">วันที่ ........./........./.........</div>
                        </div>
                    </div>

                    <div class="footer">
                        พิมพ์จากระบบ Kamol Rice ERP &bull; ${new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.onload = () => printWindow.print();
        };

        // Keep old editOrder for backward compat
        window.editOrder = function (id) {
            const order = mockData.orders.find(o => o.id === id);
            if (order) {
                // no-op for old orders
            }
        };

        window.editInventory = function (id) {
            const item = mockData.inventory.find(i => i.id === id);
            if (item) {
                openInventoryForm(item);
            }
        };

        window.editSilo = function (id) {
            const silo = mockData.silos.find(s => s.id === id);
            if (silo) {
                openSiloForm(silo);
            }
        };

        function openInventoryForm(item = null) {
            const editId = item?.id || '';
            const form = `
                <form onsubmit="event.preventDefault(); handleInventorySave(this, '${editId}'); return false;">
                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">รหัสสินค้า</label>
                                <input type="text" name="code" value="${item?.code || ''}" required 
                                    class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">หมวดหมู่</label>
                                <select name="category" required class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 transition-all">
                                    <option value="ข้าวสาร" ${item?.category === 'ข้าวสาร' ? 'selected' : ''}>ข้าวสาร</option>
                                    <option value="ข้าวเปลือก" ${item?.category === 'ข้าวเปลือก' ? 'selected' : ''}>ข้าวเปลือก</option>
                                    <option value="ข้าวหัก/ปลาย" ${item?.category === 'ข้าวหัก/ปลาย' ? 'selected' : ''}>ข้าวหัก/ปลาย</option>
                                    <option value="Reject" ${item?.category === 'Reject' ? 'selected' : ''}>Reject</option>
                                    <option value="วัสดุบรรจุภัณฑ์" ${item?.category === 'วัสดุบรรจุภัณฑ์' ? 'selected' : ''}>วัสดุบรรจุภัณฑ์</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">ชื่อสินค้า</label>
                            <input type="text" name="item" value="${item?.item || ''}" required 
                                class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">คงเหลือ (กก./ชิ้น)</label>
                                <input type="number" name="stock" value="${item?.stock || ''}" required 
                                    class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">ที่เก็บ</label>
                                <input type="text" name="location" value="${item?.location || ''}" required 
                                    class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all">
                            ${icons.save} บันทึกข้อมูล
                        </button>
                    </div>
                </form>
            `;
            showModal(item ? '✏️ แก้ไขสินค้าในคลัง' : '➕ เพิ่มสินค้าใหม่', form);
        }

        function openSiloForm(silo = null) {
            const editId = silo?.id || '';
            const form = `
                <form onsubmit="event.preventDefault(); handleSiloSave(this, '${editId}'); return false;">
                    <div class="space-y-5">
                        <div class="bg-gradient-to-r from-purple-50 to-pink-50 dark:from-purple-900/20 dark:to-pink-900/20 p-4 rounded-xl border border-purple-200 dark:border-purple-800">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-3xl">${icons.silo}</span>
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800 dark:text-white">ไซโล #${silo?.number || ''}</h3>
                                    <p class="text-sm text-gray-600 dark:text-gray-400">ความจุ: ${formatNumber(parseNum(silo?.capacity || 50000))} กก.</p>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">ข้าวในไซโล</label>
                            <input type="text" name="rice" value="${silo?.rice || ''}" placeholder="ระบุชนิดข้าว (เช่น ข้าวเปลือกหอมมะลิ) หรือเว้นว่างถ้าไม่มี"
                                class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">ปริมาณปัจจุบัน (กก.)</label>
                            <input type="number" name="amount" value="${silo?.amount || 0}" required min="0" max="${silo?.capacity || 50000}"
                                class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">สูงสุด: ${formatNumber(parseNum(silo?.capacity || 50000))} กก.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">ความจุไซโล (กก.)</label>
                            <input type="number" name="capacity" value="${silo?.capacity || 50000}" required min="1000"
                                class="w-full p-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all">
                            ${icons.save} บันทึกข้อมูล
                        </button>
                    </div>
                </form>
            `;
            showModal('🏭 แก้ไขสถานะไซโล', form);
        }

        window.handleInventorySave = async function (form, editId = '') {
            const itemData = {
                code: form.code.value,
                item: form.item.value,
                category: form.category.value,
                stock: parseNum(form.stock.value),
                location: form.location.value
            };

            // Close modal immediately for better UX
            document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());

            try {
                if (editId) {
                    // Edit existing item
                    const index = mockData.inventory.findIndex(i => i.id === editId);
                    if (index !== -1) {
                        mockData.inventory[index] = {
                            ...mockData.inventory[index],
                            ...itemData
                        };
                        await saveToFirestore('inventory', mockData.inventory[index]);
                    }
                } else {
                    // Add new item
                    const newItem = {
                        ...itemData,
                        id: 'temp_' + Date.now().toString()
                    };
                    const newId = await saveToFirestore('inventory', newItem);
                    newItem.id = newId;
                    mockData.inventory.push(newItem);
                }

                showToast('บันทึกสำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการบันทึก!', 'error');
            }
        };

        window.handleSiloSave = async function (form, editId = '') {
            const siloData = {
                rice: form.rice.value.trim(),
                amount: parseNum(form.amount.value),
                capacity: parseNum(form.capacity.value)
            };

            // Validate amount doesn't exceed capacity
            if (siloData.amount > siloData.capacity) {
                showToast('ปริมาณเกินความจุ!', 'error');
                return;
            }

            // Close modal immediately for better UX
            document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());

            try {
                if (editId) {
                    // Edit existing silo
                    const index = mockData.silos.findIndex(s => s.id === editId);
                    if (index !== -1) {
                        mockData.silos[index] = {
                            ...mockData.silos[index],
                            ...siloData
                        };
                        await saveToFirestore('silos', mockData.silos[index]);
                    }
                }

                showToast('บันทึกสำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการบันทึก!', 'error');
            }
        };

        async function deleteOrder(id) {
            if (confirm('ยืนยันการลบ?')) {
                try {
                    await deleteFromFirestore('orders', id);
                    mockData.orders = mockData.orders.filter(o => o.id !== id);
                    showToast('ลบสำเร็จ!');
                    render();
                } catch (error) {
                    showToast('เกิดข้อผิดพลาดในการลบ!', 'error');
                }
            }
        }

        window.deleteInventory = async function (id) {
            if (confirm('ยืนยันการลบสินค้านี้?')) {
                try {
                    await deleteFromFirestore('inventory', id);
                    mockData.inventory = mockData.inventory.filter(i => i.id !== id);
                    showToast('ลบสินค้าสำเร็จ!');
                    render();
                } catch (error) {
                    showToast('เกิดข้อผิดพลาดในการลบ!', 'error');
                }
            }
        };

        window.openInventoryFormWithZone = function (zoneName) {
            openInventoryForm({ location: zoneName });
        };

        // ===================== RENDER FUNCTIONS =====================
        function renderDashboard() {
            const sales = mockData.orders.filter(o => o.status === 'สำเร็จ').reduce((sum, o) => sum + parseNum(o.amount), 0);
            const lowStock = mockData.inventory.filter(i => parseNum(i.stock) < 1000);
            const pendingOrders = mockData.orders.filter(o => ['รอดำเนินการ', 'กำลังส่ง'].includes(o.status)).length;

            return `
                <div class="space-y-6 fade-in">
                    ${lowStock.length > 0 ? `
                        <div class="bg-gradient-to-r from-red-50 to-orange-50 dark:from-red-900/20 dark:to-orange-900/20 border-2 border-red-200 dark:border-red-800 rounded-2xl p-5 shadow-lg">
                            <div class="flex items-start gap-4">
                                <div class="p-3 bg-white dark:bg-gray-800 rounded-xl shadow-md text-3xl">${icons.alert}</div>
                                <div class="flex-1">
                                    <h3 class="font-bold text-red-800 dark:text-red-400 text-lg mb-2">⚠️ สินค้าใกล้หมด (${lowStock.length} รายการ)</h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${lowStock.slice(0, 5).map(i => `
                                            <span class="text-sm bg-white dark:bg-gray-800 px-3 py-1.5 rounded-lg border-2 border-red-200 dark:border-red-700 text-red-700 dark:text-red-400 font-medium shadow-sm">
                                                ${i.item} (${formatNumber(parseNum(i.stock))} ${i.category === 'วัสดุบรรจุภัณฑ์' ? 'ชิ้น' : 'กก.'})
                                            </span>
                                        `).join('')}
                                        ${lowStock.length > 5 ? `<span class="text-sm text-red-600 dark:text-red-400 px-3 py-1.5 font-medium">+${lowStock.length - 5} รายการ</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 card-hover">
                            <div class="flex items-center gap-4">
                                <div class="p-4 rounded-xl bg-gradient-to-br from-green-500 to-emerald-600 text-white shadow-lg">
                                    <span class="text-3xl">${icons.money}</span>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">ยอดขายรวม</p>
                                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white mt-1">${formatCurrency(sales)}</h3>
                                    <p class="text-xs text-green-600 dark:text-green-400 mt-1">↑ เดือนนี้</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 card-hover cursor-pointer" onclick="currentMenu='orders'; render();">
                            <div class="flex items-center gap-4">
                                <div class="p-4 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 text-white shadow-lg">
                                    <span class="text-3xl">${icons.orders}</span>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400">คำสั่งซื้อรอดำเนินการ</p>
                                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white mt-1">${pendingOrders}</h3>
                                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">ทั้งหมด ${mockData.orders.length} รายการ</p>
                                </div>
                            </div>

                            ${items.length === 0 ? `
                                <div class="col-span-full text-center py-8 text-gray-400 dark:text-gray-600">
                                    <span class="text-3xl">📦</span>
                                    <p class="mt-2">ยังไม่มีสินค้าใน ${zoneName}</p>
                                </div>
                            ` : items.map(item => {
                    const isLow = parseNum(item.stock) < 1000;
                    return `
                                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border-2 ${isLow ? 'border-red-300 dark:border-red-700' : 'border-gray-200 dark:border-gray-700'} hover:shadow-xl transition-all card-hover relative group">
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="px-2 py-1 bg-${color}-600 text-white text-xs font-bold rounded-md">${item.code}</span>
                                            <div class="flex items-center gap-1">
                                                ${isLow ? `<span class="text-red-500 text-lg animate-pulse">${icons.alert}</span>` : ''}
                                                <button onclick="event.stopPropagation(); deleteInventory('${item.id}')" 
                                                    class="opacity-0 group-hover:opacity-100 p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-all" title="ลบ">
                                                    ${icons.delete}
                                                </button>
                                            </div>
                                        </div>
                                        <div onclick="editInventory('${item.id}')" class="cursor-pointer">
                                            <h4 class="font-semibold text-sm text-gray-800 dark:text-white mb-2 line-clamp-2 min-h-[40px]">${item.item}</h4>
                                            <div class="text-center py-2 bg-gray-50 dark:bg-gray-900 rounded-lg">
                                                <div class="text-2xl font-bold ${isLow ? 'text-red-600' : 'text-gray-800 dark:text-white'}">
                                                    ${formatNumber(parseNum(item.stock))}
                                                </div>
                                                <div class="text-xs text-gray-500 dark:text-gray-400">${item.category === 'วัสดุบรรจุภัณฑ์' ? 'ชิ้น' : 'กก.'}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                }).join('')}
                        </div>
                    </div>
                `;
            };

            return `
                <div class="space-y-6 fade-in">
                    <!-- Warehouse Map Header -->
                    <div class="bg-gradient-to-r from-blue-50 to-cyan-50 dark:from-blue-900/20 dark:to-cyan-900/20 p-6 rounded-2xl border-2 border-blue-200 dark:border-blue-800 shadow-lg">
                        <div class="flex items-center gap-3">
                            <div class="p-3 bg-white dark:bg-gray-800 rounded-xl shadow-md">
                                <span class="text-3xl">🗺️</span>
                            </div>
                            <div>
                                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">แผนผังคลังสินค้า (Warehouse Map)</h2>
                                <p class="text-sm text-gray-600 dark:text-gray-400">มุมมองตามโซนการจัดเก็บ</p>
                            </div>
                        </div>
                    </div>

                    <!-- Warehouse Zones -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        ${renderZone('โกดัง A (Warehouse A)', warehouseA, 'amber', '🏢', 'โกดัง A')}
                        ${renderZone('โกดัง B (Warehouse B)', warehouseB, 'amber', '🏢', 'โกดัง B')}
                        ${renderZone('โกดัง C (Warehouse C)', warehouseC, 'amber', '🏢', 'โกดัง C')}
                    </div>

                    <!-- Production Zones -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderZone('Zone A (ข้าวต้น)', zoneA, 'green', '📦', 'Zone A')}
                        ${renderZone('Zone B (Reject)', zoneB, 'orange', '📦', 'Zone B')}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${renderZone('Zone C (ข้าวหัก/ปลาย)', zoneC, 'blue', '📦', 'Zone C')}
                        ${renderZone('Zone D (Reject)', zoneD, 'red', '📦', 'Zone D')}
                    </div>

                    <!-- Other Storage -->
                    <div class="p-5 rounded-2xl border-2 border-gray-200 dark:border-gray-700 bg-gradient-to-br from-gray-50 to-white dark:from-gray-800 dark:to-gray-900 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg text-gray-800 dark:text-white flex items-center gap-2">
                                <span class="text-xl">📁</span>
                                พื้นที่อื่นๆ (Other Storage)
                                <span class="text-sm font-normal text-gray-500 dark:text-gray-400">(${others.length} รายการ)</span>
                            </h3>
                            <button onclick="event.stopPropagation(); openInventoryForm()" 
                                class="p-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-1" title="เพิ่มสินค้าใหม่">
                                <span class="text-lg font-bold">+</span>
                                <span class="text-xs hidden sm:inline">เพิ่ม</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            ${others.length === 0 ? `
                                <div class="col-span-full text-center py-8 text-gray-400 dark:text-gray-600">
                                    <span class="text-3xl">📦</span>
                                    <p class="mt-2">ยังไม่มีสินค้าในพื้นที่อื่นๆ</p>
                                </div>
                            ` : others.map(item => {
                const isLow = parseNum(item.stock) < 1000;
                return `
                                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border-2 ${isLow ? 'border-red-300 dark:border-red-700' : 'border-gray-200 dark:border-gray-700'} hover:shadow-xl transition-all card-hover relative group">
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="px-2 py-1 bg-purple-600 text-white text-xs font-bold rounded-md">${item.code}</span>
                                            <div class="flex items-center gap-1">
                                                ${isLow ? `<span class="text-red-500 text-lg animate-pulse">${icons.alert}</span>` : ''}
                                                <button onclick="event.stopPropagation(); deleteInventory('${item.id}')" 
                                                    class="opacity-0 group-hover:opacity-100 p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-all" title="ลบ">
                                                    ${icons.delete}
                                                </button>
                                            </div>
                                        </div>
                                        <div onclick="editInventory('${item.id}')" class="cursor-pointer">
                                            <h4 class="font-semibold text-sm text-gray-800 dark:text-white mb-2 line-clamp-2 min-h-[40px]">${item.item}</h4>
                                            <div class="text-center py-2 bg-gray-50 dark:bg-gray-900 rounded-lg">
                                                <div class="text-2xl font-bold ${isLow ? 'text-red-600' : 'text-gray-800 dark:text-white'}">
                                                    ${formatNumber(parseNum(item.stock))}
                                                </div>
                                                <div class="text-xs text-gray-500 dark:text-gray-400">${item.category === 'วัสดุบรรจุภัณฑ์' ? 'ชิ้น' : 'กก.'}</div>
                                            </div>
                                            <div class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1 mt-2">
                                                <span>📍</span>
                                                ${item.location}
                                            </div>
                                        </div>
                                    </div>
                                `;
            }).join('')}
                        </div>
                    </div>

                    <!-- Summary Stats -->
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700">
                        <h3 class="font-bold text-lg mb-4 dark:text-white flex items-center gap-2">
                            <span class="text-xl">📊</span>
                            สรุปสต็อกแยกตามหมวดหมู่
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                            ${['ข้าวสาร', 'ข้าวเปลือก', 'ข้าวหัก/ปลาย', 'Reject', 'วัสดุบรรจุภัณฑ์'].map(cat => {
                const items = mockData.inventory.filter(i => i.category === cat);
                const total = items.reduce((s, i) => s + parseNum(i.stock), 0);
                const colorMap = {
                    'ข้าวสาร': 'green',
                    'ข้าวเปลือก': 'yellow',
                    'ข้าวหัก/ปลาย': 'blue',
                    'Reject': 'red',
                    'วัสดุบรรจุภัณฑ์': 'purple'
                };
                const color = colorMap[cat];
                return `
                                    <div class="p-4 bg-${color}-50 dark:bg-${color}-900/20 rounded-xl border border-${color}-200 dark:border-${color}-800 text-center">
                                        <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${cat}</div>
                                        <div class="text-2xl font-bold text-${color}-600 dark:text-${color}-400">${formatNumber(total)}</div>
                                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${items.length} รายการ</div>
                                    </div>
                                `;
            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCustomers() {
            return `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden fade-in">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 border-b-2 border-gray-200 dark:border-gray-700">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ชื่อ</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ประเภท</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">โทร</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ภูมิภาค</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ที่อยู่</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                                ${mockData.customers.map(c => `
                                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-all">
                                        <td class="px-6 py-4 font-semibold text-gray-800 dark:text-white">${c.name}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400">
                                                ${c.type}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${c.phone}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                ${c.region}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${c.location}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ===================== MAIN RENDER =====================
        function render() {
            const menuList = [
                { id: 'dashboard', icon: icons.dashboard, label: 'ภาพรวม' },
                { id: 'orders', icon: icons.orders, label: 'คำสั่งซื้อ' },
                { id: 'production', icon: icons.production, label: 'การผลิต' },
                { id: 'inventory', icon: icons.inventory, label: 'คลังสินค้า' },
                { id: 'customers', icon: icons.customers, label: 'ลูกค้า' },
                { id: 'logs', icon: icons.logs, label: 'ประวัติ' }
            ];

            let content = '';
            switch (currentMenu) {
                case 'dashboard': content = renderDashboard(); break;
                case 'orders': content = renderOrders(); break;
                case 'production': content = renderProduction(); break;
                case 'inventory': content = renderInventory(); break;
                case 'customers': content = renderCustomers(); break;
                default: content = '<div class="text-center py-20 text-gray-500 dark:text-gray-400">กำลังพัฒนา...</div>';
            }

            // Add loading indicator
            const loadingIndicator = isLoading ? `
                <div class="fixed top-4 right-4 z-50 bg-white dark:bg-gray-800 shadow-lg rounded-xl px-4 py-2 flex items-center gap-2 border border-green-200 dark:border-green-800">
                    <div class="animate-spin w-5 h-5 border-2 border-green-600 border-t-transparent rounded-full"></div>
                    <span class="text-sm text-green-700 dark:text-green-400 font-medium">กำลังโหลดข้อมูล...</span>
                </div>
            ` : '';

            document.getElementById('app').innerHTML = `
                ${loadingIndicator}
                <div class="flex h-screen">
                    <!-- Mobile Menu Overlay -->
                    ${mobileMenuOpen ? `<div class="fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="mobileMenuOpen = false; render();"></div>` : ''}

                    <!-- Sidebar -->
                    <div class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-transform duration-300 ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none">
                        <div class="h-20 flex items-center justify-center border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-green-50 to-emerald-50 dark:from-gray-900 dark:to-gray-800">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-gradient-to-br from-green-600 to-emerald-600 text-white rounded-2xl flex items-center justify-center font-bold text-2xl shadow-lg">K</div>
                                <div>
                                    <h1 class="font-bold text-gray-800 dark:text-white text-xl">กมลค้าข้าว</h1>
                                    <p class="text-xs text-gray-500 dark:text-gray-400">Rice Mill ERP</p>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 space-y-2 flex-1 overflow-y-auto">
                            ${menuList.map(m => `
                                <button onclick="currentMenu='${m.id}'; mobileMenuOpen=false; render();" 
                                    class="w-full flex items-center gap-3 p-3.5 rounded-xl transition-all duration-200 ${currentMenu === m.id
                    ? 'bg-gradient-to-r from-green-600 to-emerald-600 text-white font-semibold shadow-lg scale-105'
                    : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white'
                }">
                                    <span class="text-xl">${m.icon}</span>
                                    <span class="flex-1 text-left">${m.label}</span>
                                    ${currentMenu === m.id ? '<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>' : ''}
                                </button>
                            `).join('')}
                        </div>
                        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                            <div class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-700 dark:to-gray-600 p-4 rounded-xl flex items-center gap-3 shadow-sm">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-600 to-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-md">A</div>
                                <div class="flex-1">
                                    <p class="text-sm font-semibold text-gray-800 dark:text-white">ผู้ดูแลระบบ</p>
                                    <p class="text-xs text-green-600 dark:text-green-400 flex items-center gap-1">
                                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                        ออนไลน์
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Content -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <!-- Header -->
                        <header class="h-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center px-6 shadow-sm">
                            <div class="flex items-center gap-4">
                                <button onclick="mobileMenuOpen = true; render();" class="lg:hidden p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span class="text-2xl">${icons.menu}</span>
                                </button>
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">${menuList.find(m => m.id === currentMenu)?.label}</h2>
                                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${new Date().toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode); render();" 
                                    class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span class="text-2xl">${darkMode ? icons.sun : icons.moon}</span>
                                </button>
                                ${currentMenu === 'orders' ? `
                                    <button onclick="openSOForm()" 
                                        class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all flex items-center gap-2">
                                        <span class="text-lg">${icons.plus}</span>
                                        <span class="hidden sm:inline">สร้างใบสั่งซื้อ (SO)</span>
                                    </button>
                                ` : ''}
                            </div>
                        </header>

                        <!-- Content -->
                        <main class="flex-1 p-4 lg:p-8 overflow-y-auto bg-gray-50 dark:bg-gray-900">
                            <div class="max-w-7xl mx-auto">
                                ${content}
                            </div>
                        </main>
                    </div>
                </div>
            `;

            if (darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // ===================== INIT =====================
        // Try to load from cache first for instant display
        const hasCached = loadFromCache();
        if (!hasCached) {
            render(); // Initial render with mock data if no cache
        }
        // Then sync with Firestore in background
        seedSilosToFirestore().then(() => loadDataFromFirestore());
    </script>
</body>

</html>
