            }
        }

        }

            opacity: 0.4;
            transform: scale(0.97);

        }

            height: 4px;
            background: linear-gradient(90deg, #16a34a, #059669);
            border-radius: 4px;
            margin: 4px 0;
            transition: opacity 0.15s;
            opacity: 0;
            pointer-events: none;

            opacity: 1;

        async function loadDataFromFirestore() {
            try {
                const collections = ['orders', 'salesOrders', 'inventory', 'customers', 'production', 'silos', 'yields', 'logs'];
                for (const collName of collections) {
                    const snapshot = await db.collection(collName).get();
                    if (!snapshot.empty) {
                        const firestoreData = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                        // For silos: replace entirely with Firestore data
                        if (collName === 'silos') {
                            mockData.silos = firestoreData;
                            // Sort silos by number
                            mockData.silos.sort((a, b) => (a.number || 0) - (b.number || 0));
                        } else {
                            // For other collections: merge
                            firestoreData.forEach(fsItem => {
                                const existingIndex = mockData[collName].findIndex(m => m.id === fsItem.id);
                                if (existingIndex !== -1) {
                                    mockData[collName][existingIndex] = fsItem;
                                } else {
                                    mockData[collName].push(fsItem);
                                }
                            });
                        }
                    }
                }
                console.log('✅ Loaded data from Firestore');
                isLoading = false;
                saveToCache(); // Save to cache for next visit
                render();
            } catch (error) {
                console.error('❌ Error loading from Firestore:', error);
                isLoading = false;
                render();
            }
        }

        // Seed initial silos to Firestore only if empty

            try {
                const snapshot = await db.collection('silos').get();
                // Only seed if Firestore has no silos

                    console.log('🌱 Seeding silos to Firestore...');
                    for (const silo of mockData.silos) {
                        await db.collection('silos').doc(silo.id).set(silo);
                    }
                    console.log('✅ Silos seeded successfully');
                } else {
                    console.log('ℹ️ Silos already exist in Firestore, skipping seed');
                }
            } catch (error) {
                console.error('❌ Error seeding silos:', error);
            }
        }

        async function saveToFirestore(collection, data) {
            try {
                if (data.id && !data.id.startsWith('temp_')) {
                    await db.collection(collection).doc(data.id).set(data);
                } else {
                    const docRef = await db.collection(collection).add(data);
                    data.id = docRef.id;
                    // Update the document with the correct id field to prevent duplicates on reload
                    await docRef.update({ id: docRef.id });
                }
                console.log(`✅ Saved to ${collection}:`, data.id);
                return data.id;
            } catch (error) {
                console.warn(`⚠️ Firebase save failed for ${collection}, falling back to local storage:`, error.message || error);
                // Generate a local ID if needed
                if (!data.id || data.id.startsWith('temp_')) {
                    data.id = 'local_' + Date.now().toString() + '_' + Math.random().toString(36).substr(2, 5);
                }
                return data.id;
            }
        }

        // ===================== SO NUMBER GENERATION =====================
        function generateSONumber() {
            const now = new Date();
            const yy = (now.getFullYear() + 543).toString().slice(-2); // Buddhist era
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            soCounter++;
            localStorage.setItem('soCounter', soCounter.toString());
            return `SO${yy}${mm}-${String(soCounter).padStart(4, '0')}`;
        }

        let soLineItems = [{ product: '', brand: '', packSize: '', qty: '', unit: 'กระสอบ', unitPrice: '', amount: 0, totalWeight: 0 }];

        function addSOLineItem() {
            soLineItems.push({ product: '', brand: '', packSize: '', qty: '', unit: 'กระสอบ', unitPrice: '', amount: 0, totalWeight: 0 });
            rerenderSOItems();
        }

        function removeSOLineItem(idx) {
            if (soLineItems.length <= 1) return;
            soLineItems.splice(idx, 1);
            rerenderSOItems();
            recalcSOTotals();
        }

        function onSOItemChange(idx, field, value) {
            soLineItems[idx][field] = value;
            // Recalc this row
            const item = soLineItems[idx];
            const qty = parseNum(item.qty);
            const price = parseNum(item.unitPrice);
            const pack = parseNum(item.packSize);
            item.amount = qty * price;
            item.totalWeight = qty * pack;

            if (field === 'product' || field === 'brand') {
                rerenderSOItems();
            } else {
                // Update just the computed fields for this row
                const amtEl = document.getElementById(`so-item-amount-${idx}`);
                const wgtEl = document.getElementById(`so-item-weight-${idx}`);
                if (amtEl) amtEl.textContent = formatNumber(item.amount);
                if (wgtEl) wgtEl.textContent = pack > 0 && qty > 0 ? `${formatNumber(item.totalWeight)} กก.` : '-';
            }
            recalcSOTotals();
        }

        function recalcSOTotals() {
            const subtotal = soLineItems.reduce((s, i) => s + (parseNum(i.qty) * parseNum(i.unitPrice)), 0);
            const discountEl = document.getElementById('so-discount');
            const discount = discountEl ? parseNum(discountEl.value) : 0;
            const grand = subtotal - discount;

            const subEl = document.getElementById('so-subtotal');
            const grandEl = document.getElementById('so-grandtotal');
            const totalWeightEl = document.getElementById('so-total-weight');
            if (subEl) subEl.textContent = formatCurrency(subtotal);
            if (grandEl) grandEl.textContent = formatCurrency(grand);

            const totalWeight = soLineItems.reduce((s, i) => s + (parseNum(i.qty) * parseNum(i.packSize)), 0);
            if (totalWeightEl) totalWeightEl.textContent = totalWeight > 0 ? `${formatNumber(totalWeight)} กก. (${(totalWeight / 1000).toFixed(2)} ตัน)` : '-';
        }

                                    <option value="">-- เลือกสินค้า --</option>

                                    <option value="">-- เลือกแบรนด์ --</option>
                                    ${BRANDS.map(b => `<option value="${b}" ${item.brand === b ? 'selected' : ''}>${b}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-gray-600 dark:text-gray-400">ขนาดบรรจุ (กก.)</label>
                                <input type="number" value="${item.packSize}" min="0" step="any" oninput="onSOItemChange(${idx}, 'packSize', this.value)" placeholder="เช่น 15, 48"
                                    class="w-full p-2.5 border-2 border-gray-200 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:border-green-500 transition-all text-sm">
                            </div>

                                    <input type="text" name="truckNo" value="${so?.truckNo || ''}" placeholder="เช่น กข-1234"

        // ===================== SO SAVE HANDLER =====================
        window.handleSOSave = async function (editId, soNumber) {
            const form = document.getElementById('so-form');
            if (!form) return;

            // Validate at least one line item has product
            const validItems = soLineItems.filter(i => i.product);
            if (validItems.length === 0) {
                showToast('กรุณาเลือกสินค้าอย่างน้อย 1 รายการ', 'error');
                return;
            }

            const subtotal = validItems.reduce((s, i) => s + (parseNum(i.qty) * parseNum(i.unitPrice)), 0);
            const discount = parseNum(form.discount.value);

            const soData = {
                soNumber: soNumber,
                orderDate: form.orderDate.value,
                customerName: form.customerName.value,
                customerRef: form.customerRef.value,
                items: validItems.map(i => ({
                    product: i.product,
                    brand: i.brand || '',
                    packSize: parseNum(i.packSize),
                    qty: parseNum(i.qty),
                    unit: i.unit,
                    unitPrice: parseNum(i.unitPrice),
                    amount: parseNum(i.qty) * parseNum(i.unitPrice),
                    totalWeight: parseNum(i.qty) * parseNum(i.packSize)
                })),
                deliveryDate: form.deliveryDate.value,
                shippingAddress: form.shippingAddress.value,
                deliveryMethod: form.deliveryMethod.value,
                truckNo: form.truckNo.value,
                driverName: form.driverName.value,
                freightTerms: form.freightTerms.value,

        window.importSOFromExcel = function () {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls';
            input.onchange = async function (e) {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const data = await file.arrayBuffer();
                    const wb = XLSX.read(data);
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                    if (rows.length === 0) {
                        showToast('ไฟล์ไม่มีข้อมูล', 'error');
                        return;
                    }

                    // Group rows into SOs: rows with 'ลูกค้า' filled start a new SO
                    const soGroups = [];
                    let current = null;
                    rows.forEach(row => {
                        const customer = String(row['ลูกค้า'] || '').trim();
                        if (customer) {
                            current = { header: row, items: [] };
                            soGroups.push(current);
                        }
                        if (current && String(row['สินค้า'] || '').trim()) {
                            current.items.push(row);
                        }
                    });

                    if (soGroups.length === 0) {
                        showToast('ไม่พบข้อมูล SO ที่ถูกต้อง', 'error');
                        return;
                    }

                    let importedCount = 0;
                    for (const group of soGroups) {
                        const h = group.header;
                        const soNumber = String(h['เลขที่ SO'] || '').trim() || generateSONumber();
                        const items = group.items.map(r => {
                            const qty = parseNum(r['จำนวน']);
                            const price = parseNum(r['ราคา/หน่วย']);
                            const pack = parseNum(r['ขนาดบรรจุ (กก.)']);
                            return {
                                product: String(r['สินค้า'] || '').trim(),
                                brand: String(r['แบรนด์'] || '').trim(),
                                packSize: pack, qty: qty,
                                unit: String(r['หน่วย'] || 'กระสอบ').trim(),
                                unitPrice: price,
                                amount: qty * price,
                                totalWeight: qty * pack
                            };
                        });
                        const subtotal = items.reduce((s, i) => s + i.amount, 0);
                        const discount = parseNum(h['ส่วนลด']);
                        const soData = {
                            soNumber: soNumber,
                            orderDate: String(h['วันที่สั่งซื้อ'] || new Date().toISOString().split('T')[0]).trim(),
                            customerName: String(h['ลูกค้า'] || '').trim(),
                            customerRef: String(h['อ้างอิง PO'] || '').trim(),
                            items: items,
                            deliveryDate: String(h['วันที่นัดส่ง'] || '').trim(),
                            deliveryMethod: String(h['วิธีจัดส่ง'] || '').trim(),
                            freightTerms: String(h['เงื่อนไขค่าขนส่ง'] || '').trim(),
                            truckNo: '', driverName: '', shippingAddress: '',
                            paymentTerms: String(h['เงื่อนไขชำระเงิน'] || 'เงินสด (COD)').trim(),
                            subtotal: subtotal, discount: discount, grandTotal: subtotal - discount,
                            internalRemarks: String(h['หมายเหตุภายใน'] || '').trim(),
                            customerRemarks: String(h['หมายเหตุท้ายบิล'] || '').trim(),
                            status: String(h['สถานะ'] || 'จัดเตรียมผลิต').trim(),
                            id: 'temp_' + Date.now().toString() + '_' + importedCount,
                            createdAt: new Date().toISOString()
                        };
                        try {
                            const newId = await saveToFirestore('salesOrders', soData);
                            soData.id = newId;
                        } catch (err) {
                            console.error('Firestore save error during import:', err);
                        }
                        mockData.salesOrders.unshift(soData);
                        importedCount++;
                    }

                    saveToCache();
                    showToast(`Import สำเร็จ! นำเข้า ${importedCount} ใบสั่งซื้อ`);
                    render();
                } catch (err) {
                    console.error('Import error:', err);

        // ===================== KANBAN DRAG & DROP =====================
        let kanbanDragState = { dragging: null, fromCol: null };

        window.kanbanDragStart = function (e, soId, colKey) {
            kanbanDragState.dragging = soId;
            kanbanDragState.fromCol = colKey;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', soId);
            // Delay adding class so the drag image captures the original look
            requestAnimationFrame(() => {
                e.target.closest('.kanban-card').classList.add('dragging');
            });
        };

        window.kanbanDragEnd = function (e) {
            kanbanDragState.dragging = null;
            kanbanDragState.fromCol = null;
            document.querySelectorAll('.kanban-card.dragging').forEach(el => el.classList.remove('dragging'));
            document.querySelectorAll('.kanban-drop-indicator.active').forEach(el => el.classList.remove('active'));
        };

        window.kanbanDragOver = function (e, colKey) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const column = e.currentTarget;
            const cards = [...column.querySelectorAll('.kanban-card:not(.dragging)')];
            const indicators = [...column.querySelectorAll('.kanban-drop-indicator')];

            // Clear all indicators in this column
            indicators.forEach(ind => ind.classList.remove('active'));

            // Find closest card below cursor
            const mouseY = e.clientY;
            let closestCard = null;
            let closestOffset = Number.NEGATIVE_INFINITY;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const offset = mouseY - rect.top - rect.height / 2;
                if (offset < 0 && offset > closestOffset) {
                    closestOffset = offset;
                    closestCard = card;
                }
            });

            // Show correct indicator
            if (closestCard) {
                const indicator = closestCard.previousElementSibling;
                if (indicator && indicator.classList.contains('kanban-drop-indicator')) {
                    indicator.classList.add('active');
                }
            } else {
                // Show last indicator (bottom)
                const lastIndicator = indicators[indicators.length - 1];
                if (lastIndicator) lastIndicator.classList.add('active');
            }
        };

        window.kanbanDragLeave = function (e) {
            // Only clear if truly leaving the container
            if (!e.currentTarget.contains(e.relatedTarget)) {
                e.currentTarget.querySelectorAll('.kanban-drop-indicator.active').forEach(el => el.classList.remove('active'));
            }
        };

        // ===================== INVENTORY DRAG & DROP =====================
        let invDragState = { dragging: null, fromZone: null };

        window.invDragStart = function (e, itemId, zoneName) {
            invDragState.dragging = itemId;
            invDragState.fromZone = zoneName;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', itemId);
            requestAnimationFrame(() => {
                const card = e.target.closest('.inv-card');
                if (card) card.classList.add('dragging');
            });
        };

        window.invDragEnd = function (e) {
            invDragState.dragging = null;
            invDragState.fromZone = null;
            document.querySelectorAll('.inv-card.dragging').forEach(el => el.classList.remove('dragging'));
            document.querySelectorAll('.inv-drop-indicator.active').forEach(el => el.classList.remove('active'));
        };

        window.invDragOver = function (e, zoneName) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const container = e.currentTarget;
            const cards = [...container.querySelectorAll('.inv-card:not(.dragging)')];
            const indicators = [...container.querySelectorAll('.inv-drop-indicator')];

            indicators.forEach(ind => ind.classList.remove('active'));

            // In a grid layout, find the card closest to the cursor
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            let closestCard = null;
            let closestDist = Infinity;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(mouseX - cx, mouseY - cy);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            if (closestCard) {
                const rect = closestCard.getBoundingClientRect();
                const isBeforeCard = mouseX < rect.left + rect.width / 2;
                const indicator = isBeforeCard
                    ? closestCard.previousElementSibling
                    : closestCard.nextElementSibling;
                if (indicator && indicator.classList.contains('inv-drop-indicator')) {
                    indicator.classList.add('active');
                }
            } else {
                const lastIndicator = indicators[indicators.length - 1];
                if (lastIndicator) lastIndicator.classList.add('active');
            }
        };

        window.invDragLeave = function (e) {
            if (!e.currentTarget.contains(e.relatedTarget)) {
                e.currentTarget.querySelectorAll('.inv-drop-indicator.active').forEach(el => el.classList.remove('active'));
            }
        };

        window.invDrop = function (e, zoneName) {
            e.preventDefault();
            const draggedId = invDragState.dragging;
            if (!draggedId) return;

            const container = e.currentTarget;
            const cards = [...container.querySelectorAll('.inv-card:not(.dragging)')];
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            const allCardsInZone = [...container.querySelectorAll('.inv-card')];
            let currentIds = allCardsInZone.map(c => c.dataset.itemId).filter(id => id !== draggedId);

            // Find insertion index based on cursor position
            let insertIdx = currentIds.length;
            let closestCard = null;
            let closestDist = Infinity;

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.hypot(mouseX - cx, mouseY - cy);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            if (closestCard) {
                const rect = closestCard.getBoundingClientRect();
                const cardId = closestCard.dataset.itemId;
                const idx = currentIds.indexOf(cardId);
                if (idx !== -1) {
                    const isBeforeCard = mouseX < rect.left + rect.width / 2;
                    insertIdx = isBeforeCard ? idx : idx + 1;
                }
            }

            currentIds.splice(insertIdx, 0, draggedId);

            inventorySortOrder[zoneName] = currentIds;
            localStorage.setItem('inventorySortOrder', JSON.stringify(inventorySortOrder));

            container.querySelectorAll('.inv-drop-indicator.active').forEach(el => el.classList.remove('active'));

            render();
        };

        window.kanbanDrop = function (e, colKey) {
            e.preventDefault();
            const draggedId = kanbanDragState.dragging;
            if (!draggedId) return;

            const column = e.currentTarget;
            const cards = [...column.querySelectorAll('.kanban-card:not(.dragging)')];
            const mouseY = e.clientY;

            // Get current order of IDs in this column
            const allCardsInCol = [...column.querySelectorAll('.kanban-card')];
            let currentIds = allCardsInCol.map(c => c.dataset.soId).filter(id => id !== draggedId);

            // Find insertion index
            let insertIdx = currentIds.length; // default: end
            for (let i = 0; i < cards.length; i++) {
                const rect = cards[i].getBoundingClientRect();
                if (mouseY < rect.top + rect.height / 2) {
                    const cardId = cards[i].dataset.soId;
                    insertIdx = currentIds.indexOf(cardId);
                    if (insertIdx === -1) insertIdx = currentIds.length;
                    break;
                }
            }

            // Insert dragged id at position
            currentIds.splice(insertIdx, 0, draggedId);

            // Save to kanbanSortOrder
            kanbanSortOrder[colKey] = currentIds;
            localStorage.setItem('kanbanSortOrder', JSON.stringify(kanbanSortOrder));

            // Clear indicators
            column.querySelectorAll('.kanban-drop-indicator.active').forEach(el => el.classList.remove('active'));

            // Re-render
            render();
        };

                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>

        function renderOrdersKanban(filtered, allSO, STATUS_CONFIG) {
            if (filtered.length === 0) {
                return `

                        <div class="flex flex-col items-center gap-4">

                            </p>
                            <p class="text-sm text-gray-400 dark:text-gray-500">

                            </p>
                        </div>
                    </div>
                `;
            }

            // Group by delivery date
            const groups = {};
            filtered.forEach(so => {
                const key = so.deliveryDate || '__none__';
                if (!groups[key]) groups[key] = [];
                groups[key].push(so);
            });

            // Apply custom sort order within each group
            Object.keys(groups).forEach(key => {
                const savedOrder = kanbanSortOrder[key];
                if (savedOrder && savedOrder.length > 0) {
                    groups[key].sort((a, b) => {
                        const idxA = savedOrder.indexOf(a.id);
                        const idxB = savedOrder.indexOf(b.id);
                        // Items not in saved order go to the end
                        const posA = idxA === -1 ? 9999 : idxA;
                        const posB = idxB === -1 ? 9999 : idxB;
                        return posA - posB;
                    });
                }
            });

            // Sort column keys chronologically, "no date" last
            const sortedKeys = Object.keys(groups).sort((a, b) => {
                if (a === '__none__') return 1;
                if (b === '__none__') return -1;
                return a.localeCompare(b);
            });

            // Determine if a date is today, past, or future
            const todayStr = new Date().toISOString().split('T')[0];

            // Color palette for columns
            const colColors = ['green', 'blue', 'purple', 'amber', 'cyan', 'pink', 'indigo', 'teal', 'orange', 'rose'];

            return `
                <div class="flex gap-4 overflow-x-auto kanban-scroll pb-4" style="min-height: 400px;">

                const sos = groups[key];
                const isNoDate = key === '__none__';
                const colLabel = isNoDate ? '📌 ไม่ระบุวันส่ง' : `📅 ${formatDate(key)}`;
                const isPast = !isNoDate && key < todayStr;
                const isToday = !isNoDate && key === todayStr;
                const colColor = colColors[colIdx % colColors.length];
                const totalAmount = sos.reduce((s, so) => s + parseNum(so.grandTotal), 0);

                return `

                                <div class="p-4 border-b-2 ${isToday ? 'border-green-300 dark:border-green-700 bg-gradient-to-r from-green-100 to-emerald-100 dark:from-green-900/30 dark:to-emerald-900/30' :
                        isPast ? 'border-red-200 dark:border-red-800 bg-gradient-to-r from-red-50 to-orange-50 dark:from-red-900/20 dark:to-orange-900/20' :
                            isNoDate ? 'border-gray-200 dark:border-gray-700 bg-gradient-to-r from-gray-100 to-gray-50 dark:from-gray-700 dark:to-gray-800' :
                                'border-gray-200 dark:border-gray-700 bg-gradient-to-r from-blue-50 to-cyan-50 dark:from-blue-900/20 dark:to-cyan-900/20'
                    }">
                                    <div class="flex items-center justify-between mb-1">
                                        <h3 class="font-bold text-sm ${isToday ? 'text-green-800 dark:text-green-300' :
                        isPast ? 'text-red-700 dark:text-red-400' :
                            'text-gray-800 dark:text-white'
                    }">${colLabel}</h3>
                                        <span class="px-2 py-0.5 rounded-full text-xs font-bold ${isToday ? 'bg-green-600 text-white' :
                        isPast ? 'bg-red-500 text-white' :
                            isNoDate ? 'bg-gray-500 text-white' :
                                'bg-blue-500 text-white'
                    }">${sos.length}</span>
                                    </div>
                                    ${isToday ? '<div class="text-xs font-semibold text-green-600 dark:text-green-400">📍 วันนี้</div>' : ''}
                                    ${isPast ? '<div class="text-xs font-semibold text-red-500 dark:text-red-400">⚠️ เลยกำหนดส่ง</div>' : ''}
                                    <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">รวม: ${formatCurrency(totalAmount)}</div>
                                </div>
                                <!-- Column Cards -->
                                <div class="flex-1 p-3 overflow-y-auto kanban-col-cards" data-col-key="${key}" 
                                    ondragover="kanbanDragOver(event, '${key}')" 
                                    ondragleave="kanbanDragLeave(event)" 
                                    ondrop="kanbanDrop(event, '${key}')" 
                                    style="max-height: calc(100vh - 340px);">
                                    ${sos.map((so, soIdx) => {
                        const cfg = STATUS_CONFIG[so.status] || STATUS_CONFIG['จัดเตรียมผลิต'];
                        const itemsSummary = (so.items || []).map(i => i.product).filter(Boolean).join(', ');
                        const totalQty = (so.items || []).reduce((s, i) => s + parseNum(i.qty), 0);
                        return `
                                            <div class="kanban-drop-indicator"></div>
                                            <div class="kanban-card bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm hover:shadow-lg transition-all p-3.5 group" 
                                                draggable="true" 
                                                data-so-id="${so.id}" 
                                                ondragstart="kanbanDragStart(event, '${so.id}', '${key}')"

        // Export CSV for a specific delivery date
        window.exportDailyCSV = function (deliveryDateKey) {
            const allSO = mockData.salesOrders || [];
            let filtered;
            let filename;
            if (deliveryDateKey === '__none__') {
                filtered = allSO.filter(so => !so.deliveryDate);
                filename = 'SO_no_delivery_date.csv';
            } else {
                filtered = allSO.filter(so => so.deliveryDate === deliveryDateKey);
                filename = 'SO_deliver_' + deliveryDateKey + '.csv';
            }
            if (filtered.length === 0) { alert('ไม่มีรายการ'); return; }

            // Build CSV rows (per line item)
            const BOM = '\uFEFF';
            const headers = ['เลขที่ SO', 'วันสั่ง', 'วันจัดส่ง', 'ลูกค้า', 'PO ลูกค้า', 'สินค้า', 'ขนาดบรรจุ (กก.)', 'จำนวน (กระสอบ)', 'น้ำหนักรวม (กก.)', 'ราคา/กระสอบ', 'ยอดรวม', 'สถานะ', 'วิธีจัดส่ง', 'วิธีชำระเงิน'];
            const rows = [headers.join(',')];
            filtered.forEach(so => {
                const items = so.items || [];
                if (items.length === 0) {
                    rows.push([
                        so.soNumber, so.orderDate || '', so.deliveryDate || '', '"' + (so.customerName || '') + '"', '"' + (so.customerRef || '') + '"',
                        '', '', '', '', '', so.grandTotal || 0, '"' + (so.status || '') + '"', '"' + (so.deliveryMethod || '') + '"', '"' + (so.paymentMethod || '') + '"'
                    ].join(','));
                } else {
                    items.forEach(item => {
                        const w = parseNum(item.totalWeight) || (parseNum(item.qty) * parseNum(item.packSize));
                        rows.push([
                            so.soNumber, so.orderDate || '', so.deliveryDate || '', '"' + (so.customerName || '') + '"', '"' + (so.customerRef || '') + '"',
                            '"' + (item.product || '') + '"', item.packSize || '', item.qty || '', w, item.unitPrice || '', item.lineTotal || '',
                            '"' + (so.status || '') + '"', '"' + (so.deliveryMethod || '') + '"', '"' + (so.paymentMethod || '') + '"'
                        ].join(','));
                    });
                }
            });

            const csv = BOM + rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.confirmPayment = async function (soId) {
            const input = document.getElementById('paymentAmountInput');
            if (!input) return;
            const amount = parseNum(input.value);
            if (amount <= 0) { showToast('กรุณาระบุจำนวนเงิน', 'error'); return; }

            const so = mockData.salesOrders.find(o => o.id === soId);
            if (!so) return;

            const currentPaid = parseNum(so.paidAmount || 0);
            so.paidAmount = currentPaid + amount;

            // Auto-update status if fully paid
            if (so.paidAmount >= parseNum(so.grandTotal)) {
                so.status = 'จ่ายเงินสำเร็จ';
            }

            // Close modal
            document.querySelectorAll('.fixed.z-50').forEach(el => el.remove());

            try {
                await saveToFirestore('salesOrders', so);
                saveToCache();
                showToast('บันทึกการชำระเงิน ' + formatCurrency(amount) + ' สำเร็จ!');
                render();
            } catch (error) {
                showToast('เกิดข้อผิดพลาด!', 'error');

                    const color = colorMap[cat];
                    return `
                                    <div class="p-4 bg-${color}-50 dark:bg-${color}-900/20 rounded-xl border border-${color}-200 dark:border-${color}-800 text-center">
                                        <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${cat}</div>
                                        <div class="text-2xl font-bold text-${color}-600 dark:text-${color}-400">${formatNumber(total)}</div>
                                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${items.length} รายการ</div>
                                    </div>
                                `;
                }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCustomers() {
            return `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden fade-in">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 border-b-2 border-gray-200 dark:border-gray-700">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ชื่อ</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ประเภท</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">โทร</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ภูมิภาค</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-600 dark:text-gray-400 uppercase">ที่อยู่</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                                ${mockData.customers.map(c => `
                                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-all">
                                        <td class="px-6 py-4 font-semibold text-gray-800 dark:text-white">${c.name}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400">
                                                ${c.type}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${c.phone}</td>
                                        <td class="px-6 py-4">
                                            <span class="px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">
                                                ${c.region}
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">${c.location}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ===================== MAIN RENDER =====================
        function render() {
            const menuList = [
                { id: 'dashboard', icon: icons.dashboard, label: 'ภาพรวม' },
                { id: 'orders', icon: icons.orders, label: 'คำสั่งซื้อ' },
                { id: 'production', icon: icons.production, label: 'การผลิต' },
                { id: 'inventory', icon: icons.inventory, label: 'คลังสินค้า' },
                { id: 'customers', icon: icons.customers, label: 'ลูกค้า' },
                { id: 'logs', icon: icons.logs, label: 'ประวัติ' }
            ];

            let content = '';
            switch (currentMenu) {
                case 'dashboard': content = renderDashboard(); break;
                case 'orders': content = renderOrders(); break;
                case 'production': content = renderProduction(); break;
                case 'inventory': content = renderInventory(); break;
                case 'customers': content = renderCustomers(); break;
                default: content = '<div class="text-center py-20 text-gray-500 dark:text-gray-400">กำลังพัฒนา...</div>';
            }

            // Add loading indicator
            const loadingIndicator = isLoading ? `
                <div class="fixed top-4 right-4 z-50 bg-white dark:bg-gray-800 shadow-lg rounded-xl px-4 py-2 flex items-center gap-2 border border-green-200 dark:border-green-800">
                    <div class="animate-spin w-5 h-5 border-2 border-green-600 border-t-transparent rounded-full"></div>
                    <span class="text-sm text-green-700 dark:text-green-400 font-medium">กำลังโหลดข้อมูล...</span>
                </div>
            ` : '';

            document.getElementById('app').innerHTML = `
                ${loadingIndicator}
                <div class="flex h-screen">
                    <!-- Mobile Menu Overlay -->
                    ${mobileMenuOpen ? `<div class="fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="mobileMenuOpen = false; render();"></div>` : ''}

                    <!-- Sidebar -->
                    <div class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-transform duration-300 ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none">
                        <div class="h-20 flex items-center justify-center border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-green-50 to-emerald-50 dark:from-gray-900 dark:to-gray-800">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-gradient-to-br from-green-600 to-emerald-600 text-white rounded-2xl flex items-center justify-center font-bold text-2xl shadow-lg">K</div>
                                <div>
                                    <h1 class="font-bold text-gray-800 dark:text-white text-xl">กมลค้าข้าว</h1>
                                    <p class="text-xs text-gray-500 dark:text-gray-400">Rice Mill ERP</p>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 space-y-2 flex-1 overflow-y-auto">
                            ${menuList.map(m => `
                                <button onclick="currentMenu='${m.id}'; mobileMenuOpen=false; render();" 
                                    class="w-full flex items-center gap-3 p-3.5 rounded-xl transition-all duration-200 ${currentMenu === m.id
                    ? 'bg-gradient-to-r from-green-600 to-emerald-600 text-white font-semibold shadow-lg scale-105'
                    : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white'
                }">
                                    <span class="text-xl">${m.icon}</span>
                                    <span class="flex-1 text-left">${m.label}</span>
                                    ${currentMenu === m.id ? '<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>' : ''}
                                </button>
                            `).join('')}
                        </div>
                        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
                            <div class="bg-gradient-to-r from-gray-50 to-gray-100 dark:from-gray-700 dark:to-gray-600 p-4 rounded-xl flex items-center gap-3 shadow-sm">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-600 to-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-md">A</div>
                                <div class="flex-1">
                                    <p class="text-sm font-semibold text-gray-800 dark:text-white">ผู้ดูแลระบบ</p>
                                    <p class="text-xs text-green-600 dark:text-green-400 flex items-center gap-1">
                                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                        ออนไลน์
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Content -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <!-- Header -->
                        <header class="h-20 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center px-6 shadow-sm">
                            <div class="flex items-center gap-4">
                                <button onclick="mobileMenuOpen = true; render();" class="lg:hidden p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span class="text-2xl">${icons.menu}</span>
                                </button>
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">${menuList.find(m => m.id === currentMenu)?.label}</h2>
                                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${new Date().toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); document.documentElement.classList.toggle('dark', darkMode); render();" 
                                    class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                                    <span class="text-2xl">${darkMode ? icons.sun : icons.moon}</span>
                                </button>
                                ${currentMenu === 'orders' ? `
                                    <div class="flex items-center gap-2">
                                        <button onclick="downloadSOTemplate()" 
                                            class="hidden sm:flex bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 px-3 py-2.5 rounded-xl text-sm font-medium transition-all items-center gap-1.5" title="ดาวน์โหลด Template Excel">
                                            📄 Template
                                        </button>
                                        <button onclick="importSOFromExcel()" 
                                            class="bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:hover:bg-blue-900/50 text-blue-700 dark:text-blue-400 px-4 py-2.5 rounded-xl font-semibold transition-all flex items-center gap-1.5 border border-blue-200 dark:border-blue-800" title="นำเข้าข้อมูลจาก Excel">
                                            📥 <span class="hidden sm:inline">Import</span>
                                        </button>
                                        <button onclick="exportSOToExcel()" 
                                            class="bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-900/30 dark:hover:bg-emerald-900/50 text-emerald-700 dark:text-emerald-400 px-4 py-2.5 rounded-xl font-semibold transition-all flex items-center gap-1.5 border border-emerald-200 dark:border-emerald-800" title="ส่งออกข้อมูลเป็น Excel">
                                            📤 <span class="hidden sm:inline">Export</span>
                                        </button>
                                        <button onclick="openSOForm()" 
                                            class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all flex items-center gap-2">
                                            <span class="text-lg">${icons.plus}</span>
                                            <span class="hidden sm:inline">สร้างใบสั่งซื้อ (SO)</span>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </header>

                        <!-- Content -->
                        <main class="flex-1 p-4 lg:p-8 overflow-y-auto bg-gray-50 dark:bg-gray-900">
                            <div class="max-w-7xl mx-auto">
                                ${content}
                            </div>
                        </main>
                    </div>
                </div>
            `;

            if (darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // ===================== INIT =====================
        // Try to load from cache first for instant display
        const hasCached = loadFromCache();
        if (!hasCached) {
            render(); // Initial render with mock data if no cache
        }
        // Then sync with Firestore in background
        seedSilosToFirestore().then(() => loadDataFromFirestore());
    </script>
</body>

</html>
